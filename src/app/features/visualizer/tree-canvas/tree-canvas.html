@let data = layout();

@if (data.nodes.length === 0) {
  <p class="empty">Empty tree</p>
} @else {
  <svg
    class="tree"
    [attr.viewBox]="viewBox()"
    preserveAspectRatio="xMidYMid meet"
    role="img"
    aria-label="Binary tree diagram"
  >
    <g class="edges">
      @for (e of data.edges; track e.childId) {
        <line [attr.x1]="e.x1" [attr.y1]="e.y1" [attr.x2]="e.x2" [attr.y2]="e.y2" />
      }
    </g>

    <g class="nodes">
      @for (n of data.nodes; track n.id) {
        <g class="node" [attr.transform]="'translate(' + n.x + ',' + n.y + ')'">
          <circle [attr.r]="radius" />
          <text text-anchor="middle" dominant-baseline="central">{{ n.val }}</text>
        </g>
      }
    </g>
  </svg>
}
